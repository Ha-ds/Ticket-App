<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">A passenger train crossing a stone viaduct at dusk</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16213E"/>
      <stop offset="0.28" stop-color="#2B3B6B"/>
      <stop offset="0.52" stop-color="#9A5F35"/>
      <stop offset="0.68" stop-color="#E8A33D"/>
      <stop offset="1" stop-color="#F6C56E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F6C56E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F6C56E" stop-opacity="0"/>
    </radialGradient>

    <!-- one passenger coach, 92 x 28 -->
    <g id="coach">
      <rect x="0" y="0" width="92" height="24" rx="4" fill="#F1F3F5"/>
      <rect x="0" y="16" width="92" height="4" fill="#E8A33D"/>
      <rect x="8" y="5" width="11" height="8" rx="1.5" fill="#FFD98A"/>
      <rect x="25" y="5" width="11" height="8" rx="1.5" fill="#FFD98A"/>
      <rect x="42" y="5" width="11" height="8" rx="1.5" fill="#FFD98A"/>
      <rect x="59" y="5" width="11" height="8" rx="1.5" fill="#FFD98A"/>
      <rect x="76" y="5" width="9" height="8" rx="1.5" fill="#FFD98A"/>
      <rect x="10" y="24" width="18" height="4" rx="1" fill="#0F1830"/>
      <rect x="64" y="24" width="18" height="4" rx="1" fill="#0F1830"/>
    </g>

    <!-- one viaduct opening: 80 wide, arch top at y=254 -->
    <path id="arch" d="M0 320 V294 A40 40 0 0 1 80 294 V320 Z"/>
  </defs>

  <!-- sky -->
  <rect width="840" height="320" fill="url(#sky)"/>

  <!-- a few stars -->
  <g fill="#F1F3F5">
    <circle cx="70" cy="34" r="1.6" opacity="0.9"/>
    <circle cx="148" cy="64" r="1.2" opacity="0.7"/>
    <circle cx="236" cy="28" r="1.4" opacity="0.8"/>
    <circle cx="330" cy="58" r="1" opacity="0.6"/>
    <circle cx="418" cy="24" r="1.6" opacity="0.9"/>
    <circle cx="512" cy="52" r="1.2" opacity="0.7"/>
    <circle cx="590" cy="30" r="1.4" opacity="0.8"/>
    <circle cx="790" cy="46" r="1.2" opacity="0.7"/>
  </g>

  <!-- sun -->
  <circle cx="722" cy="172" r="150" fill="url(#glow)"/>
  <circle cx="722" cy="172" r="42" fill="#FFE2A0"/>

  <!-- far mountains -->
  <path d="M0 196 L82 148 L146 180 L236 118 L328 182 L420 140 L516 190 L610 132 L700 192 L782 152 L840 184 V320 H0 Z" fill="#3A4D82" opacity="0.95"/>
  <!-- snow-lit ridges -->
  <path d="M236 118 L262 134 L246 138 L236 130 L226 140 L212 134 Z" fill="#F1F3F5" opacity="0.55"/>
  <path d="M610 132 L636 148 L620 152 L610 144 L600 154 L586 148 Z" fill="#F1F3F5" opacity="0.5"/>

  <!-- mid hills -->
  <path d="M0 236 Q110 196 250 226 T520 216 T840 204 V320 H0 Z" fill="#223159"/>

  <!-- viaduct -->
  <rect x="0" y="228" width="840" height="76" fill="#0F1830"/>
  <rect x="0" y="226" width="840" height="4" fill="#1B2850"/>
  <g fill="#223159">
    <use href="#arch" x="20"/>
    <use href="#arch" x="140"/>
    <use href="#arch" x="260"/>
    <use href="#arch" x="380"/>
    <use href="#arch" x="500"/>
    <use href="#arch" x="620"/>
    <use href="#arch" x="740"/>
  </g>

  <!-- train, heading right -->
  <g transform="translate(0 0)">
    <use href="#coach" x="120" y="200"/>
    <use href="#coach" x="216" y="200"/>
    <use href="#coach" x="312" y="200"/>
    <use href="#coach" x="408" y="200"/>

    <!-- locomotive -->
    <g transform="translate(504 200)">
      <path d="M4 0 H60 Q78 0 92 15 V24 H0 V4 Q0 0 4 0 Z" fill="#F1F3F5"/>
      <rect x="0" y="16" width="92" height="4" fill="#E8A33D"/>
      <path d="M52 4 H68 Q76 4 82 11 H52 Z" fill="#FFD98A"/>
      <rect x="10" y="5" width="11" height="8" rx="1.5" fill="#FFD98A"/>
      <rect x="27" y="5" width="11" height="8" rx="1.5" fill="#FFD98A"/>
      <rect x="10" y="24" width="18" height="4" rx="1" fill="#0F1830"/>
      <rect x="64" y="24" width="18" height="4" rx="1" fill="#0F1830"/>
      <circle cx="90" cy="17" r="2.6" fill="#FFF3CF"/>
    </g>
  </g>

  <!-- foreground hills -->
  <path d="M0 296 Q180 264 400 290 T840 282 V320 H0 Z" fill="#0F1830"/>
</svg>
